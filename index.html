          say('Галочки сохраняются и видны на всех ваших устройствах.');
        });
      } catch (e) { say('Галочки сохраняются на этом устройстве.'); }
    }, function () { say('Галочки сохраняются на этом устройстве.'); });
  } else say('Галочки сохраняются на этом устройстве.');
})();
</script>
<script>
(function(){
  function back(e){
    var same = false; try { same = document.referrer && new URL(document.referrer).origin === location.origin; } catch (x) {}
    if (same && history.length > 1) { e.preventDefault(); history.back(); }
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-gtback]'), function(a){ a.addEventListener('click', back); });
})();
</script></body></html>
